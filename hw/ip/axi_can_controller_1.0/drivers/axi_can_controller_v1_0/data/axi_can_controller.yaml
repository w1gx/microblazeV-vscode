%YAML 1.2
---
# SDT (Vitis Unified IDE, 2023.2+) driver binding for AXI CAN Controller.
# Generated by vivado-axi-ip.
#
# The compatible string must match the node the SDT tooling generates for the IP
# in pl.dtsi (normally "xlnx,<ip-name-with-dashes>-<version>"). Open the
# platform's pl.dtsi and adjust the enum below if yours differs, or the BSP
# silently skips the driver.
#
# Entries under "required" (after compatible) fill XAxiCanController_Config in order:
#   compatible -> Name, reg -> BaseAddress, interrupts -> IntrId, interrupt-parent -> IntrParent

title: Bindings for AXI CAN Controller

maintainers:
  - W1GX

type: object

properties:
  compatible:
    OneOf:
      - items:
          - enum:
              - xlnx,axi-can-controller-1.0
  reg:
    description: Standard reg property
  interrupts:
    description: Interrupt line of the irq output
  interrupt-parent:
    description: Interrupt controller the irq output is connected to

config:
  - XAxiCanController_Config

required:
  - compatible
  - reg
  - interrupts
  - interrupt-parent

examples:
  xaxi_can_controller_example.c:
    - reg

...
