#
# BSP configuration, read by scripts/build_bsp.sh (shell syntax).
#
# Drivers are not listed here. Every IP in the hardware gets its driver
# automatically. After changing this file run: make bsp

# Extra libraries from the AMD embeddedsw repo, space separated. Examples:
#   xilffs (FAT file system), xilflash, xilmailbox, freertos is an OS (not here).
BSP_LIBS=""

# Add lwip220 automatically when the hardware has an Ethernet MAC
# (AXI Ethernet Lite or AXI Ethernet).
AUTO_LWIP=1

# Library options, one "library param:value ..." group per line, e.g.
#   lwip220 lwip220_dhcp:true lwip220_mem_size:65536
# The available parameters are in build/bsp/domain/bsp.yaml after a build.
BSP_LIB_OPTIONS="
xiltimer XILTIMER_en_interval_timer:true XILTIMER_tick_timer:axi_timer_0
lwip220 lwip220_dhcp:true lwip220_lwip_dhcp_does_acd_check:true lwip220_ipv6_enable:false lwip220_pbuf_pool_size:2048
"
# xiltimer: periodic tick from the AXI Timer (lwIP's TCP/DHCP timers, XTimer_SetInterval).
# lwip220:  settings of AMD's lwIP echo server template (sw/apps/echo): RAW API, DHCP
#           with address conflict check, IPv4 only, 2048 pbufs (several MB -> app runs from DDR).
